<!-- ============ 数据查看器（嵌入） ============ -->
<style>
  /* 数据查看器样式 - 独立命名空间，不影响原页面 */
  #sulan-data-viewer-toggle {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 9999;
    background: #1a73e8;
    color: white;
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(26,115,232,0.35);
    transition: transform 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sulan-data-viewer-toggle:hover {
    transform: scale(1.08);
  }

  #sulan-data-viewer-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #sulan-data-viewer-overlay.open {
    display: flex;
  }

  #sulan-data-viewer-panel {
    background: #1e1e1e;
    border-radius: 12px;
    width: min(1100px, calc(100% - 20px));
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  #sulan-data-viewer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: #2d2d2d;
    border-bottom: 1px solid #3d3d3d;
    flex-shrink: 0;
  }
  #sulan-data-viewer-header .title {
    color: #d4d4d4;
    font-size: 15px;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #sulan-data-viewer-header .title span {
    color: #6a9955;
    font-weight: 400;
    font-size: 12px;
    margin-left: 12px;
  }
  #sulan-data-viewer-header .actions {
    display: flex;
    gap: 8px;
  }
  #sulan-data-viewer-header .actions button {
    padding: 5px 14px;
    border: 1px solid #4d4d4d;
    border-radius: 4px;
    background: #3d3d3d;
    color: #d4d4d4;
    cursor: pointer;
    font-size: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background 0.15s;
  }
  #sulan-data-viewer-header .actions button:hover {
    background: #4d4d4d;
  }
  #sulan-data-viewer-header .actions button.close {
    background: #5a2d2d;
    border-color: #7a3d3d;
  }
  #sulan-data-viewer-header .actions button.close:hover {
    background: #7a3d3d;
  }

  #sulan-data-viewer-body {
    flex: 1;
    overflow: auto;
    padding: 16px 20px;
    background: #1e1e1e;
  }

  #sulan-data-viewer-body .raw-block {
    color: #d4d4d4;
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  }

  #sulan-data-viewer-body .loading-text {
    color: #888;
    text-align: center;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }

  #sulan-data-viewer-body .error-text {
    color: #f87171;
    text-align: center;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }

  #sulan-data-viewer-body .endpoint-section {
    margin-bottom: 24px;
  }
  #sulan-data-viewer-body .endpoint-section .endpoint-name {
    color: #4ec9b0;
    font-size: 13px;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #2d2d2d;
  }
  #sulan-data-viewer-body .endpoint-section .endpoint-status {
    color: #888;
    font-size: 11px;
    font-weight: 400;
    margin-left: 10px;
  }
  #sulan-data-viewer-body .endpoint-section .endpoint-status.ok { color: #6a9955; }
  #sulan-data-viewer-body .endpoint-section .endpoint-status.err { color: #f87171; }
</style>

<!-- 触发按钮 -->
<button id="sulan-data-viewer-toggle" title="查看原始数据">📊</button>

<!-- 覆盖层 -->
<div id="sulan-data-viewer-overlay">
  <div id="sulan-data-viewer-panel">
    <div id="sulan-data-viewer-header">
      <div class="title">📊 原始数据 <span id="sulan-data-viewer-status">加载中...</span></div>
      <div class="actions">
        <button onclick="window._sulanViewer.refresh()">🔄 刷新</button>
        <button onclick="window._sulanViewer.copy()">📄 复制</button>
        <button class="close" onclick="window._sulanViewer.close()">✕ 关闭</button>
      </div>
    </div>
    <div id="sulan-data-viewer-body">
      <div class="loading-text">⏳ 正在加载数据...</div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ============ 配置 ============
  const ENDPOINTS = [
    { name: '/api/admin/config', key: 'config' },
    { name: '/api/admin/stats', key: 'stats' },
    { name: '/api/admin/events', key: 'events' },
    { name: '/api/admin/leads', key: 'leads' },
    { name: '/api/admin/whatsapp', key: 'whatsapp' },
    { name: '/api/admin/pixels', key: 'pixels' },
    { name: '/api/admin/settings', key: 'settings' },
    { name: '/api/public/config', key: 'publicConfig' }
  ];

  // ============ DOM 引用 ============
  const toggleBtn = document.getElementById('sulan-data-viewer-toggle');
  const overlay = document.getElementById('sulan-data-viewer-overlay');
  const bodyEl = document.getElementById('sulan-data-viewer-body');
  const statusEl = document.getElementById('sulan-data-viewer-status');

  // ============ 状态 ============
  let isOpen = false;
  let dataCache = {};

  // ============ 数据获取 ============
  async function fetchAllData() {
    const results = {};

    for (const ep of ENDPOINTS) {
      try {
        const resp = await fetch(ep.name, {
          cache: 'no-store',
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        });
        if (!resp.ok) {
          results[ep.key] = { error: `HTTP ${resp.status}` };
          continue;
        }
        const text = await resp.text();
        try {
          results[ep.key] = JSON.parse(text);
        } catch {
          results[ep.key] = text;
        }
      } catch (err) {
        results[ep.key] = { error: err.message };
      }
    }

    return results;
  }

  // ============ 渲染 ============
  function render(data) {
    if (!data) {
      bodyEl.innerHTML = '<div class="loading-text">⏳ 正在加载数据...</div>';
      statusEl.textContent = '加载中...';
      return;
    }

    // 检查是否有错误
    const hasError = Object.values(data).some(v => v && typeof v === 'object' && v.error);
    if (hasError) {
      statusEl.textContent = '⚠️ 部分接口失败';
    } else {
      statusEl.textContent = '✅ 已加载 ' + Object.keys(data).length + ' 个接口';
    }

    let html = '';
    for (const ep of ENDPOINTS) {
      const value = data[ep.key];
      const isError = value && typeof value === 'object' && value.error;

      html += `<div class="endpoint-section">`;
      html += `<div class="endpoint-name">${ep.name} <span class="endpoint-status ${isError ? 'err' : 'ok'}">${isError ? '❌ ' + value.error : '✅ OK'}</span></div>`;
      html += `<div class="raw-block">${JSON.stringify(value, null, 2)}</div>`;
      html += `</div>`;
    }

    bodyEl.innerHTML = html;
  }

  // ============ 加载 ============
  async function loadAndRender() {
    statusEl.textContent = '加载中...';
    bodyEl.innerHTML = '<div class="loading-text">⏳ 正在加载数据...</div>';

    try {
      dataCache = await fetchAllData();
      render(dataCache);
    } catch (err) {
      bodyEl.innerHTML = `<div class="error-text">❌ 加载失败: ${err.message}</div>`;
      statusEl.textContent = '❌ 加载失败';
    }
  }

  // ============ 打开/关闭 ============
  function openViewer() {
    isOpen = true;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    loadAndRender();
  }

  function closeViewer() {
    isOpen = false;
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  function toggleViewer() {
    if (isOpen) {
      closeViewer();
    } else {
      openViewer();
    }
  }

  // ============ 复制 ============
  function copyData() {
    const text = JSON.stringify(dataCache, null, 2);
    navigator.clipboard.writeText(text).then(() => {
      const orig = statusEl.textContent;
      statusEl.textContent = '✅ 已复制到剪贴板';
      setTimeout(() => { statusEl.textContent = orig; }, 1500);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const orig = statusEl.textContent;
      statusEl.textContent = '✅ 已复制到剪贴板';
      setTimeout(() => { statusEl.textContent = orig; }, 1500);
    });
  }

  // ============ 暴露全局 ============
  window._sulanViewer = {
    open: openViewer,
    close: closeViewer,
    toggle: toggleViewer,
    refresh: loadAndRender,
    copy: copyData
  };

  // ============ 事件绑定 ============
  toggleBtn.addEventListener('click', toggleViewer);

  // 点击遮罩关闭
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      closeViewer();
    }
  });

  // ESC 键关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isOpen) {
      closeViewer();
    }
  });

  console.log('📊 数据查看器已加载，点击左下角 📊 按钮查看原始数据');
  console.log('💡 也可在控制台使用: window._sulanViewer.toggle()');
})();
</script>
<!-- ============ 数据查看器结束 ============ -->
